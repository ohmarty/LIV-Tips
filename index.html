    // ============================================
    // SUPERVISORS
    // Paid busser tips/hr × 1.20 × their hours. NEVER part of the tip pool.
    // Identified by employee ID. Names must match employeeList entries exactly.
    // Default in-time 9:30 PM; a banquet selection overrides the in-time.
    // ============================================
    const SUPERVISORS = [
      { name: "Exposito, Jorge", id: "8506" },
      { name: "Petit-Maite, Jude", id: "8621" },
      { name: "Sandovete, Rodrigo", id: "9153" }
    ];
    const SUPERVISOR_IDS = SUPERVISORS.map(s => s.id);
    const SUPERVISOR_NAMES = SUPERVISORS.map(s => s.name);
    const SUPERVISOR_DEFAULT_START = '9:30 PM'; // (no longer used — supervisors self-enter in-time; kept for reference)
    const SUPERVISOR_MULTIPLIER = 1.20;

    // Pay period anchor: 01/09/2026 (bi-weekly)
    const PAY_PERIOD_ANCHOR = new Date(2026, 0, 9); // Jan 9, 2026
    const PAY_PERIOD_DAYS = 14;

    // Helper: Get pay period for a given date
    function getPayPeriod(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      const anchor = new Date(PAY_PERIOD_ANCHOR);
      anchor.setHours(0, 0, 0, 0);
      
      const diffTime = d.getTime() - anchor.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const periodIndex = Math.floor(diffDays / PAY_PERIOD_DAYS);
      
      const startDate = new Date(anchor);
      startDate.setDate(anchor.getDate() + (periodIndex * PAY_PERIOD_DAYS));
      
      const endDate = new Date(startDate);
      endDate.setDate(startDate.getDate() + PAY_PERIOD_DAYS - 1);
      
      return { startDate, endDate, periodIndex };
    }

    // Helper: Get all dates in a pay period
    function getDatesInPeriod(startDate, endDate) {
      const dates = [];
      const current = new Date(startDate);
      while (current <= endDate) {
        dates.push(new Date(current));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    // Helper: Format date
    function formatDate(date, style = 'short') {
      if (style === 'short') {
        return date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit' });
      }
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Helper: Format date as key (using local timezone, not UTC)
    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Helper: Get business day (for overnight shifts)
    // If it's before 6 PM, the business day is yesterday
    // If it's 6 PM or later, the business day is today
    function getBusinessDay() {
      const now = new Date();
      const hours = now.getHours();

      // If it's before 6 PM (18:00), subtract one day
      if (hours < 18) {
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        return yesterday;
      }

      return now;
    }

    // Helper: Parse time string to minutes since midnight
    function parseTime(timeStr) {
      if (!timeStr) return null;
      const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if (!match) return null;
      let [_, hours, minutes, period] = match;
      hours = parseInt(hours);
      minutes = parseInt(minutes);
      if (period.toUpperCase() === 'PM' && hours !== 12) hours += 12;
      if (period.toUpperCase() === 'AM' && hours === 12) hours = 0;
      return hours * 60 + minutes;
    }

    // Helper: Calculate hours between start and end (handles overnight)
    function calculateHours(startTime, endTime) {
      let start = parseTime(startTime);
      let end = parseTime(endTime);
      if (start === null || end === null) return 0;
      
      // If end is before start, it's overnight (add 24 hours)
      if (end < start) {
        end += 24 * 60;
      }
      return (end - start) / 60;
    }

    // Helper: Format hours to hours and minutes
    function formatHours(hours) {
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      return `${h}h ${m}m`;
    }

    // ============================================
    // SHIFT POOL MATH — single source of truth
    // Pool hours =
    //   admin 10PM count × (10PM → close)
    // + admin 12AM count × (12AM → close)
    // + banquet workers (EXCLUDING supervisors): banquet-in → their cut or close
    // + extra bussers (admin-entered in-times): in → their cut or close
    // ± admin-set early cuts for the 10/12 crews
    // ± legacy self-set custom starts (old records only; new UI can't create them)
    // Supervisors are NEVER in the pool. Their pay = perHour × 1.20 × their hours.
    // ============================================
    function computeShiftPool(shift, employeeData, key) {
      if (!shift || !shift.totalTips || !shift.endTime) return null;

      let countB10 = shift.bussers10Count || 0;
      let countB12 = shift.bussers12Count || 0;

      const banquetWorkers = (shift.banquetEmployees || []).filter(n => !SUPERVISOR_NAMES.includes(n));
      const banquetInTime = shift.banquetInTime || '';
      const extraBussers = shift.extraBussers || [];
      const extraNames = extraBussers.map(e => e && e.name);

      let customHoursAdded = 0;
      const adjustments = [];

      // Per-employee adjustments from self/admin entries.
      // NOTE: supervisor NAMES are intentionally NOT skipped here — in the new build
      // supervisors can never create entries in this loop (they get a read-only
      // dashboard, and banquet/extras/cut flows flag or filter them), so the only
      // supervisor entries that exist are LEGACY busser nights that were paid as
      // bussers and must keep displaying exactly as paid.
      Object.keys(employeeData || {}).forEach(empName => {
        // Admin-entered extras are counted from the shift record instead
        if (extraNames.includes(empName)) return;

        const empDayData = employeeData[empName] && employeeData[empName][key];
        if (!empDayData || !empDayData.savedAt) return;
        if (empDayData.isBanquetWorker) return;
        if (empDayData.isExtraBusser) return;

        const hasCustomStart = empDayData.startTimeOverride && empDayData.startTimeOverride.trim() !== '';
        const hasPreset = empDayData.startTime;
        const hasCustomEnd = empDayData.endTimeOverride && empDayData.endTimeOverride.trim() !== '';

        let actualStart;
        const usedOverrideStart = hasCustomStart && (!hasPreset ||
          (empDayData.startTimeOverride_timestamp || 0) > (empDayData.startTime_timestamp || 0));

        if (usedOverrideStart) {
          actualStart = empDayData.startTimeOverride; // LEGACY records only
        } else if (hasPreset) {
          if (empDayData.startTime === '10') actualStart = '10:00 PM';
          else if (empDayData.startTime === '12') actualStart = '12:00 AM';
        }
        if (!actualStart) return;

        const actualEnd = hasCustomEnd ? empDayData.endTimeOverride : shift.endTime;
        const actualHours = calculateHours(actualStart, actualEnd);

        if (usedOverrideStart) {
          // LEGACY behavior preserved exactly for old data (incl. the default-to-12 guess)
          if (empDayData.startTime === '10') countB10--;
          else countB12--;
          customHoursAdded += actualHours;
          adjustments.push({ name: empName, type: 'custom (legacy)', hours: actualHours.toFixed(2) });
        } else if (hasCustomEnd) {
          // Admin-set early cut for a 10/12 crew member: subtract the missed hours
          const baselineHours = calculateHours(actualStart, shift.endTime);
          const diff = actualHours - baselineHours;
          customHoursAdded += diff;
          adjustments.push({ name: empName, type: 'cut early', diff: diff.toFixed(2) });
        }
      });

      // Banquet workers (supervisors already excluded)
      let banquetHours = 0;
      banquetWorkers.forEach(empName => {
        const empDayData = employeeData[empName] && employeeData[empName][key];
        let banquetEnd = shift.endTime;
        if (empDayData && empDayData.endTimeOverride && empDayData.endTimeOverride.trim() !== '') {
          banquetEnd = empDayData.endTimeOverride;
        }
        const hours = calculateHours(banquetInTime, banquetEnd);
        banquetHours += hours;
        adjustments.push({ name: empName, type: 'banquet', hours: hours.toFixed(2) });
      });

      // Extra bussers: admin-entered custom in-times, purely additive
      let extraHours = 0;
      extraBussers.forEach(entry => {
        if (!entry || !entry.name || !entry.inTime) return;
        const empDayData = employeeData[entry.name] && employeeData[entry.name][key];
        let extraEnd = shift.endTime;
        if (empDayData && empDayData.endTimeOverride && empDayData.endTimeOverride.trim() !== '') {
          extraEnd = empDayData.endTimeOverride;
        }
        const hours = calculateHours(entry.inTime, extraEnd);
        extraHours += hours;
        adjustments.push({ name: entry.name, type: 'extra', hours: hours.toFixed(2) });
      });

      const b10Hours = countB10 * calculateHours('10:00 PM', shift.endTime);
      const b12Hours = countB12 * calculateHours('12:00 AM', shift.endTime);
      const totalStaffHours = b10Hours + b12Hours + banquetHours + extraHours + customHoursAdded;

      if (totalStaffHours <= 0) return null;

      const perHour = shift.totalTips / totalStaffHours;
      return { perHour, totalStaffHours, tipPool: shift.totalTips, adjustments };
    }

    // Supervisor pay for one shift, or null if they didn't work / shift incomplete.
    function computeSupervisorShift(shift, employeeData, key, supervisorId, supervisorName) {
      if (!shift || !shift.totalTips || !shift.endTime) return null;
      const worked = (shift.supervisorsWorked || []).includes(supervisorId);
      if (!worked) return null;

      const pool = computeShiftPool(shift, employeeData, key);
      if (!pool) return null;

      const rate = pool.perHour * SUPERVISOR_MULTIPLIER;

      // BOTH in-time and out-time are SELF-ENTERED by the supervisor on their own
      // dashboard. Neither ever falls back to an admin/default time — no assumption
      // about when they arrived or left. Missing either one → pending (pay not computed).
      const supRecord = (employeeData && employeeData[supervisorName] && employeeData[supervisorName][key]) || {};
      const inTime = (supRecord.supervisorClockIn && supRecord.supervisorClockIn.trim() !== '')
        ? supRecord.supervisorClockIn : null;
      const outTime = (supRecord.supervisorClockOut && supRecord.supervisorClockOut.trim() !== '')
        ? supRecord.supervisorClockOut : null;

      if (!inTime || !outTime) {
        return { inTime, outTime, hours: 0, rate, amount: 0, busserRate: pool.perHour, pending: true };
      }

      const hours = calculateHours(inTime, outTime);
      return { inTime, outTime, hours, rate, amount: rate * hours, busserRate: pool.perHour, pending: false };
    }


    // ============================================
    // PERFORMERS
    // Stored on each night's shift record as shift.performers = ['Name', ...].
    // The searchable name list is built from every saved night (plus the
    // imported history below), so there is no separate list to fall out of sync.
    // ============================================

    // Past lineups were imported into the database (Sep 2026), so this is empty.
    // Any names added here would only appear as search suggestions.
    const HISTORICAL_PERFORMERS = {};

    function normalizePerformer(name) {
      return (name || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function getShiftPerformers(shift) {
      return (shift && Array.isArray(shift.performers)) ? shift.performers.filter(Boolean) : [];
    }

    // Every performer name ever used, unique (case-insensitive), A–Z
    function getAllPerformerNames(shiftData) {
      const map = {};
      const add = (n) => {
        const k = normalizePerformer(n);
        if (k && !map[k]) map[k] = n.trim().replace(/\s+/g, ' ');
      };
      Object.values(shiftData || {}).forEach(shift => getShiftPerformers(shift).forEach(add));
      Object.values(HISTORICAL_PERFORMERS).forEach(list => list.forEach(add));
      return Object.values(map).sort((a, b) => a.localeCompare(b));
    }

    // Full-shift tip-out for the night: per-hour rate × (10 PM → close) and (12 AM → close).
    // Uses the same pool math as everything else. Early cuts are NOT applied here,
    // so nights compare fairly.
    function computeShiftTipouts(shift, employeeData, key) {
      const pool = computeShiftPool(shift, employeeData, key);
      if (!pool) return null;
      return {
        tip10: pool.perHour * calculateHours('10:00 PM', shift.endTime),
        tip12: pool.perHour * calculateHours('12:00 AM', shift.endTime),
        perHour: pool.perHour
      };
    }

    // { normalizedName: { name, nights: [{ key, tip10, tip12, others }], avg10, avg12 } }
    // Only nights with complete tip data count.
    function buildPerformerStats(shiftData, employeeData) {
      const stats = {};
      Object.entries(shiftData || {}).forEach(([key, shift]) => {
        const names = getShiftPerformers(shift);
        if (names.length === 0) return;
        const t = computeShiftTipouts(shift, employeeData, key);
        if (!t) return;
        names.forEach(name => {
          const k = normalizePerformer(name);
          if (!k) return;
          if (!stats[k]) stats[k] = { name: name.trim(), nights: [] };
          stats[k].nights.push({
            key, tip10: t.tip10, tip12: t.tip12,
            others: names.filter(n => normalizePerformer(n) !== k)
          });
        });
      });
      Object.values(stats).forEach(s => {
        const n = s.nights.length;
        s.avg10 = s.nights.reduce((a, x) => a + x.tip10, 0) / n;
        s.avg12 = s.nights.reduce((a, x) => a + x.tip12, 0) / n;
        s.nights.sort((a, b) => b.key.localeCompare(a.key));
      });
      return stats;
    }

    // Banquet money for one busser on one night. Paid separately by the manager —
    // it is never part of the tip pool math, just shown alongside it.
    function getBanquetAmount(shift, username) {
      if (!shift || !shift.hasBanquet) return 0;
      const amount = parseFloat(shift.banquetAmount) || 0;
      if (!amount) return 0;
      const workers = shift.banquetEmployees || [];
      return workers.includes(username) ? amount : 0;
    }

    // Short label for a table cell: "Name" or "Name +2"
    function performerCellLabel(names) {
      if (!names.length) return '';
      return names.length === 1 ? names[0] : `${names[0]} +${names.length - 1}`;
    }

    // Firebase Storage helpers
    async function loadData(key) {
      try {
        const docRef = window.firestoreDoc(window.firebaseDb, 'appData', key);
        const docSnap = await window.firestoreGetDoc(docRef);
        if (docSnap.exists()) {
          return docSnap.data().value || {};
        }
        return {};
      } catch (error) {
        console.error('Error loading data:', error);
        return {};
      }
    }

    async function saveData(key, data) {
      try {
        // SAFEGUARD 1: Don't save if data hasn't been loaded from Firebase yet
        if (window.dataLoaded && !window.dataLoaded[key]) {
          console.warn(`⚠️ Blocked save for ${key} - data not yet loaded from Firebase`);
          return;
        }

        // SAFEGUARD 2: Never save empty objects for shiftData or employeeData
        // This prevents accidental data wipes
        if ((key === 'shiftData' || key === 'employeeData') && typeof data === 'object') {
          const keys = Object.keys(data);
          if (keys.length === 0) {
            console.error(`🚫 BLOCKED: Attempted to save empty ${key}! This would erase all data.`);
            return;
          }
        }

        if (key === 'employeeList') {
          console.log(`💾 [employeeList] Saving ${Array.isArray(data) ? data.length : '?'} employees at ${new Date().toISOString()}:`, data.map(e => e.name));
          console.trace('💾 [employeeList] Save triggered from:');
        } else {
          console.log(`💾 Saving ${key}:`, JSON.stringify(data).substring(0, 200) + '...');
        }

        const docRef = window.firestoreDoc(window.firebaseDb, 'appData', key);
        await window.firestoreSetDoc(docRef, { value: data }, { merge: true });
      } catch (error) {
        console.error('Error saving data:', error);
      }
    }

    // Save ONLY the entries passed in, instead of rewriting the whole document.
    // Firestore merges nested maps, so { value: { '2026-09-11': {...} } } touches
    // that one night and leaves every other night alone. This stops a phone with
    // stale data from overwriting newer entries.
    async function saveDataPartial(key, partial) {
      try {
        if (window.dataLoaded && !window.dataLoaded[key]) {
          console.warn(`⚠️ Blocked partial save for ${key} - data not yet loaded from Firebase`);
          return;
        }
        const entries = Object.keys(partial || {});
        if (entries.length === 0) {
          console.warn(`⚠️ Nothing to save for ${key}`);
          return;
        }
        console.log(`💾 Saving ${entries.length} entry(ies) in ${key}:`, entries.join(', '));
        const docRef = window.firestoreDoc(window.firebaseDb, 'appData', key);
        await window.firestoreSetDoc(docRef, { value: partial }, { merge: true });
      } catch (error) {
        console.error('Error saving data:', error);
      }
    }

    // Admin: rename, merge, or remove a performer across every night
    function PerformerManager({ shiftData, setShiftData }) {
      const [selected, setSelected] = useState('');
      const [newName, setNewName] = useState('');

      // name -> { name, dates: [] }
      const byName = {};
      Object.entries(shiftData || {}).forEach(([date, shift]) => {
        getShiftPerformers(shift).forEach(n => {
          const k = normalizePerformer(n);
          if (!byName[k]) byName[k] = { name: n.trim(), dates: [] };
          byName[k].dates.push(date);
        });
      });
      const list = Object.values(byName).sort((a, b) => a.name.localeCompare(b.name));
      const current = selected ? byName[normalizePerformer(selected)] : null;

      const applyChange = (replacement) => {
        if (!current) return;
        const target = replacement === null ? null : replacement.trim().replace(/\s+/g, ' ');
        const changes = {};
        const newData = { ...shiftData };
        current.dates.forEach(date => {
          const names = getShiftPerformers(shiftData[date]);
          const out = [];
          names.forEach(n => {
            const isMatch = normalizePerformer(n) === normalizePerformer(current.name);
            const value = isMatch ? target : n;
            if (value && !out.some(x => normalizePerformer(x) === normalizePerformer(value))) out.push(value);
          });
          newData[date] = { ...newData[date], performers: out };
          changes[date] = { performers: out };
        });
        setShiftData(newData);
        saveDataPartial('shiftData', changes);
        setSelected('');
        setNewName('');
        alert(target
          ? `✓ "${current.name}" is now "${target}" on ${current.dates.length} night(s)`
          : `✓ Removed "${current.name}" from ${current.dates.length} night(s)`);
      };

      const handleSaveName = () => {
        const target = newName.trim();
        if (!target || !current) return;
        if (normalizePerformer(target) === normalizePerformer(current.name)) { alert('That is the same name'); return; }
        const existing = byName[normalizePerformer(target)];
        const msg = existing
          ? `Merge "${current.name}" (${current.dates.length} night(s)) into "${existing.name}" (${existing.dates.length} night(s))?\n\nThey become one performer.`
          : `Rename "${current.name}" to "${target}" on ${current.dates.length} night(s)?`;
        if (confirm(msg)) applyChange(existing ? existing.name : target);
      };

      return (
        <div style={styles.card}>
          <h2 style={styles.cardTitle}>Performers ({list.length})</h2>
          <p style={{...styles.subTitle, marginBottom: '12px'}}>

    // Search-as-you-type performer picker (admin)
    function PerformerPicker({ value, onChange, allNames }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);

      const selectedKeys = value.map(normalizePerformer);
      const q = normalizePerformer(query);
      const matches = q
        ? allNames.filter(n => normalizePerformer(n).includes(q) && !selectedKeys.includes(normalizePerformer(n))).slice(0, 8)
        : [];
      const exact = allNames.find(n => normalizePerformer(n) === q);
      const canAddNew = q && !exact && !selectedKeys.includes(q);

      const addName = (name) => {
        const clean = name.trim().replace(/\s+/g, ' ');
        if (!clean) return;
        // Reuse the saved spelling if this name already exists (prevents duplicates)
        const existing = allNames.find(n => normalizePerformer(n) === normalizePerformer(clean));
        const finalName = existing || clean;
        if (selectedKeys.includes(normalizePerformer(finalName))) return;
        onChange([...value, finalName]);
        setQuery('');
        setOpen(false);
      };

      return (
        <div style={{position: 'relative'}}>
          {value.length > 0 && (
            <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '10px'}}>
              {value.map(name => (
                <span key={name} style={{
                  display: 'inline-flex', alignItems: 'center', gap: '6px',
                  padding: '6px 10px', borderRadius: '999px', fontSize: '14px',
                  background: 'rgba(139, 92, 246, 0.2)', border: '1px solid rgba(139, 92, 246, 0.4)'
                }}>
                  {name}
                  <span
                    onClick={() => onChange(value.filter(n => n !== name))}
                    style={{cursor: 'pointer', color: '#c4b5fd', fontWeight: 700}}
                  >✕</span>
                </span>
              ))}
            </div>
          )}
          <input
            type="text"
            value={query}
            placeholder="Type performer name..."
            onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
            onFocus={() => setOpen(true)}
            onBlur={() => setTimeout(() => setOpen(false), 150)}
            onKeyDown={(e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                if (matches.length > 0) addName(matches[0]);
                else if (canAddNew) addName(query);
              }
            }}
            style={{...styles.input, width: '100%'}}
            autoComplete="off"
          />
          {open && (matches.length > 0 || canAddNew) && (
            <div style={{
              position: 'absolute', left: 0, right: 0, top: '100%', marginTop: '4px', zIndex: 50,
              background: '#1a1a25', border: '1px solid #2a2a3a', borderRadius: '12px',
              maxHeight: '240px', overflowY: 'auto', boxShadow: '0 10px 30px rgba(0,0,0,0.5)'
            }}>
              {matches.map(name => (
                <div
                  key={name}
                  onMouseDown={(e) => { e.preventDefault(); addName(name); }}
                  style={{padding: '12px 14px', cursor: 'pointer', borderBottom: '1px solid #2a2a3a'}}
                >
                  {name}
                </div>
              ))}
              {canAddNew && (
                <div
                  onMouseDown={(e) => { e.preventDefault(); addName(query); }}
                  style={{padding: '12px 14px', cursor: 'pointer', color: '#06ffa5'}}
                >
                  + Add new: "{query.trim()}"
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Month calendar — months stacked, scroll up/down (like Apple Calendar).
    // getDay(date) -> { amount: number|null, start, end } for this user.
    function CalendarView({ shiftData, getDay, stickyTop }) {
      const today = new Date();
      const currentRef = React.useRef(null);
      const [selected, setSelected] = useState(null);

      // Months from Jan 2026 through next month
      const months = [];
      const last = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      for (let d = new Date(2026, 0, 1); d <= last; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
        months.push(new Date(d));
      }
      const isCurrent = (m) => m.getFullYear() === today.getFullYear() && m.getMonth() === today.getMonth();

      const scrollToToday = (smooth) => {
        const el = currentRef.current;
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.scrollY - ((stickyTop || 0) + 110);
        window.scrollTo({ top: y, behavior: smooth ? 'smooth' : 'auto' });
      };
      useEffect(() => { scrollToToday(false); }, []);

      const renderMonth = (m) => {
        const y = m.getFullYear(), mo = m.getMonth();
        const startDow = new Date(y, mo, 1).getDay();
        const dim = new Date(y, mo + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startDow; i++) cells.push(null);
        let total = 0, banquetTotal = 0;
        for (let i = 1; i <= dim; i++) {
          const date = new Date(y, mo, i, 12);
          const info = getDay(date) || {};
          if (info.amount != null) {
            total += info.amount;
            banquetTotal += info.banquet || 0;
          }
          cells.push({ date, info });
        }

        return (
          <div key={`${y}-${mo}`} ref={isCurrent(m) ? currentRef : null} style={{marginBottom: '28px'}}>
            <div style={{display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', padding: '0 4px 8px'}}>
              <span style={{fontSize: '24px', fontWeight: 700}}>
                {m.toLocaleDateString('en-US', { month: 'long' })}
                {y !== today.getFullYear() && <span style={{color: '#888899', fontWeight: 500}}> {y}</span>}
              </span>
              <span style={{textAlign: 'right'}}>
                <span style={{display: 'block', fontSize: '15px', fontWeight: 700, color: total > 0 ? '#06ffa5' : '#555566'}}>
                  ${total.toFixed(2)}
                </span>
                {banquetTotal > 0 && (
                  <span style={{display: 'block', fontSize: '12px', fontWeight: 700, color: '#ffc857'}}>
                    B: ${banquetTotal.toFixed(2)}
                  </span>
                )}
              </span>
            </div>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, minmax(0, 1fr))'}}>
              {cells.map((c, i) => {
                if (!c) return <div key={`e${i}`} />;
                const { date, info } = c;
                const key = dateKey(date);
                const worked = info.amount != null;
                // Days the busser didn't work stay empty (no tip, no artist)
                const names = worked ? getShiftPerformers(shiftData[key]) : [];
                const isToday = dateKey(date) === dateKey(today);
                const isSel = selected === key;
                const weekend = date.getDay() === 0 || date.getDay() === 6;
                return (
                  <div
                    key={key}
                    onClick={() => { if (worked) setSelected(isSel ? null : key); }}
                    style={{
                      borderTop: '1px solid #2a2a3a', minHeight: '66px', padding: '3px 2px 4px',
                      display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 0,
                      cursor: worked ? 'pointer' : 'default', borderRadius: isSel ? '8px' : 0,
                      background: isSel ? 'rgba(139, 92, 246, 0.25)' : 'transparent'
                    }}
                  >
                    <span style={{
                      alignSelf: 'flex-start', fontSize: '10px', fontWeight: 600, lineHeight: '16px',
                      minWidth: '16px', height: '16px', textAlign: 'center', borderRadius: '8px',
                      background: isToday ? '#ef4444' : 'transparent',
                      color: isToday ? '#fff' : (weekend ? '#888899' : '#ccccdd')
                    }}>{date.getDate()}</span>
                    {info.amount != null && (
                      <span style={{fontSize: '12px', fontWeight: 700, color: '#06ffa5', marginTop: '2px', whiteSpace: 'nowrap'}}>
                        ${Math.round(info.amount)}
                      </span>
                    )}
                    {worked && info.banquet > 0 && (
                      <span style={{fontSize: '10px', fontWeight: 700, color: '#ffc857', whiteSpace: 'nowrap'}}>
                        B: ${Math.round(info.banquet)}
                      </span>
                    )}
                    {names.length > 0 && (
                      <span style={{
                        fontSize: '9px', lineHeight: '11px', color: '#c4b5fd', textAlign: 'center',
                        marginTop: '2px', width: '100%', overflow: 'hidden', wordBreak: 'break-word',
                        display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical'
                      }}>{names.join(', ')}</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const sel = selected ? new Date(selected + 'T12:00:00') : null;
      const selInfo = sel ? (getDay(sel) || {}) : null;
      const selNames = selected ? getShiftPerformers(shiftData[selected]) : [];

      return (
        <div style={{paddingBottom: sel ? '150px' : '70px'}}>
          {/* Sticky weekday row */}
          <div style={{
            position: 'sticky', top: `${(stickyTop || 0) + 62}px`, zIndex: 20, display: 'grid',
            gridTemplateColumns: 'repeat(7, minmax(0, 1fr))', padding: '8px 0',
            background: '#0a0a0f', borderBottom: '1px solid #2a2a3a', marginBottom: '12px'
          }}>
            {['S','M','T','W','T','F','S'].map((d, i) => (
              <div key={i} style={{padding: '0 2px'}}>
                <span style={{display: 'inline-block', minWidth: '16px', textAlign: 'center', fontSize: '11px', fontWeight: 600, color: '#888899'}}>{d}</span>
              </div>
            ))}
          </div>

          {months.map(renderMonth)}

          {/* Floating bar: Today button + selected day */}
          <div style={{position: 'fixed', left: '12px', right: '12px', bottom: '16px', zIndex: 30, maxWidth: '560px', margin: '0 auto'}}>
            {sel && (
              <div style={{...styles.card, padding: '14px 16px', marginBottom: '10px', boxShadow: '0 10px 30px rgba(0,0,0,0.6)'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px'}}>
                  <span style={{fontSize: '16px', fontWeight: 700}}>
                    {sel.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
                  </span>
                  <span onClick={() => setSelected(null)} style={{color: '#888899', cursor: 'pointer', padding: '0 4px'}}>✕</span>
                </div>
                <div style={{fontSize: '14px', color: '#c4b5fd', marginBottom: '6px'}}>
                  {selNames.length ? selNames.join(', ') : 'No performer listed'}
                </div>
                {selInfo.amount != null ? (
                  <>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                    <span style={{fontSize: '14px', color: '#888899'}}>{selInfo.start || '--'} – {selInfo.end || '--'}</span>
                    <span style={{fontSize: '20px', fontWeight: 700, color: '#06ffa5'}}>${selInfo.amount.toFixed(2)}</span>
                  </div>
                  {selInfo.banquet > 0 && (
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px'}}>
                      <span style={{fontSize: '14px', color: '#888899'}}>Banquet</span>
                      <span style={{fontSize: '16px', fontWeight: 700, color: '#ffc857'}}>${selInfo.banquet.toFixed(2)}</span>
                    </div>
                  )}
                  </>
                ) : (
                  <div style={{fontSize: '14px', color: '#888899'}}>No tips for you this day</div>
                )}
              </div>
            )}
            <button
              onClick={() => scrollToToday(true)}
              style={{
                padding: '10px 20px', borderRadius: '999px', border: '1px solid #2a2a3a',
                background: 'rgba(26, 26, 37, 0.95)', color: '#fff', fontSize: '15px', fontWeight: 600,
                cursor: 'pointer', boxShadow: '0 6px 20px rgba(0,0,0,0.5)'
              }}
            >Today</button>
          </div>
        </div>
      );
    }

          setError('Please select your name');
          return;

        if (!employeeId) {
          setError('Please enter your employee ID');
          return;
        }

        // Find the selected employee
        const employee = employeeList.find(emp => emp.name === selectedEmployee);

        if (!employee) {
          setError('Employee not found');
          return;
        }

        // Verify employee ID
        if (employee.id !== employeeId.trim()) {
          setError('Invalid employee ID');
          return;
        }

        // Determine role based on employee ID
        const role = SUPERVISOR_IDS.includes(employee.id) ? 'supervisor' : 'busser';

        onLogin(employee.name, employee.id, role);
      };

      return (
        <div style={styles.loginContainer}>

                  ))}
                </select>
              </div>

              <div style={styles.inputGroup}>
                <label style={styles.label}>Employee ID</label>
                <input
                  type="text"
                  value={employeeId}
                  onChange={(e) => setEmployeeId(e.target.value)}
                  style={styles.input}
                  placeholder="Enter your employee ID"
                  inputMode="numeric"
                />
              </div>

              {error && <p style={styles.error}>{error}</p>}

              <span onClick={() => onLogin('__ADMIN__', '', 'admin')} style={styles.adminLinkText}>
                Admin Access →
              </span>
            </div>
          </div>
        </div>
      );
    }

    // Admin Panel Component
    function AdminPanel({ shiftData, setShiftData, employeeData, setEmployeeData, employeeList, setEmployeeList, onLogout }) {
      const [currentPage, setCurrentPage] = useState('shift-data');
      const [selectedDate, setSelectedDate] = useState(dateKey(getBusinessDay()));
      const [totalTips, setTotalTips] = useState('');
      const [endTimeHour, setEndTimeHour] = useState('');
      const [endTimeMin, setEndTimeMin] = useState('00');
      const [endTimePeriod, setEndTimePeriod] = useState('AM');
      const [bussers10Count, setBussers10Count] = useState('');
      const [bussers12Count, setBussers12Count] = useState('');
      const [saved, setSaved] = useState(false);

      // Banquet tracking
      const [hasBanquet, setHasBanquet] = useState(false);
      const [banquetEmployees, setBanquetEmployees] = useState([]);
      const [banquetAmount, setBanquetAmount] = useState('');
      const [banquetInHour, setBanquetInHour] = useState('');
      const [banquetInMin, setBanquetInMin] = useState('00');
      const [banquetInPeriod, setBanquetInPeriod] = useState('PM');

      // Supervisors on shift (IDs). In-time is admin-controlled (9:30 PM or banquet-in);
      // clock-OUT is entered by the supervisor on their own dashboard, not here.
      const [supervisorsWorked, setSupervisorsWorked] = useState([]);

      // Performers for the selected night
      const [performers, setPerformers] = useState([]);
      const allPerformerNames = getAllPerformerNames(shiftData);

      // Extra bussers — admin-entered custom in-times (additive pool hours)
      const [extraBussers, setExtraBussers] = useState([]); // [{ name, inTime }]
      const [extraName, setExtraName] = useState('');
      const [extraInHour, setExtraInHour] = useState('');
      const [extraInMin, setExtraInMin] = useState('00');
      const [extraInPeriod, setExtraInPeriod] = useState('PM');

      // Early departure tracking (batch)
      const [showEarlyDeparture, setShowEarlyDeparture] = useState(false);
      const [batchCutSelected, setBatchCutSelected] = useState([]);
      const [earlyEndHour, setEarlyEndHour] = useState('');
      const [earlyEndMin, setEarlyEndMin] = useState('00');
      const [earlyEndPeriod, setEarlyEndPeriod] = useState('AM');
      const [hoveredEntry, setHoveredEntry] = useState(null);
      const [showSaveCheck, setShowSaveCheck] = useState(false);

      // Edit early departure modal
      const [showEditDepartureModal, setShowEditDepartureModal] = useState(false);
      const [editingEmployee, setEditingEmployee] = useState('');
      const [editDepartureHour, setEditDepartureHour] = useState('');
      const [editDepartureMin, setEditDepartureMin] = useState('00');
      const [editDeparturePeriod, setEditDeparturePeriod] = useState('AM');
      const [hoveredDepartureEmployee, setHoveredDepartureEmployee] = useState(null);
      const isMobileAdmin = typeof window !== 'undefined' && window.innerWidth < 768;

      // Employee management
      const [newEmployeeName, setNewEmployeeName] = useState('');
      const [newEmployeeId, setNewEmployeeId] = useState('');

      // Load existing data when date changes
      useEffect(() => {
        const existing = shiftData[selectedDate];
        if (existing) {
          setTotalTips(existing.totalTips?.toString() || '');
          if (existing.endTime) {
            const match = existing.endTime.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (match) {
              setEndTimeHour(match[1]);
              setEndTimeMin(match[2]);
              setEndTimePeriod(match[3].toUpperCase());
            }
          } else {
            setEndTimeHour('');
            setEndTimeMin('00');
            setEndTimePeriod('AM');
          }
          setBussers10Count(existing.bussers10Count?.toString() || '');
          setBussers12Count(existing.bussers12Count?.toString() || '');
          // Load banquet data
          setHasBanquet(existing.hasBanquet || false);
          setBanquetEmployees(existing.banquetEmployees || []);
          setBanquetAmount(existing.banquetAmount != null ? String(existing.banquetAmount) : '');
          if (existing.banquetInTime) {
            const banquetMatch = existing.banquetInTime.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (banquetMatch) {
              setBanquetInHour(banquetMatch[1]);
              setBanquetInMin(banquetMatch[2]);
              setBanquetInPeriod(banquetMatch[3].toUpperCase());
            }
          } else {
            setBanquetInHour('');
            setBanquetInMin('00');
            setBanquetInPeriod('PM');
          }
          // Load supervisors + extras
          setSupervisorsWorked(existing.supervisorsWorked || []);
          setExtraBussers(existing.extraBussers || []);
          setPerformers(getShiftPerformers(existing));
        } else {
          setTotalTips('');
          setEndTimeHour('');
          setEndTimeMin('00');
          setEndTimePeriod('AM');
          setBussers10Count('');
          setBussers12Count('');
          setHasBanquet(false);
          setBanquetEmployees([]);
          setBanquetAmount('');
          setBanquetInHour('');
          setBanquetInMin('00');
          setBanquetInPeriod('PM');
          setSupervisorsWorked([]);
          setExtraBussers([]);
          setPerformers([]);
        }
        setExtraName('');
        setExtraInHour('');
        setExtraInMin('00');
        setExtraInPeriod('PM');
        setBatchCutSelected([]);
        setSaved(false);
      }, [selectedDate, shiftData]);

      const handleSave = () => {
        const formattedMin = endTimeMin.toString().padStart(2, '0');
        const fullEndTime = endTimeHour ? `${endTimeHour}:${formattedMin} ${endTimePeriod}` : '';

        // Format banquet in time
        const banquetFormattedMin = banquetInMin.toString().padStart(2, '0');
        const fullBanquetInTime = banquetInHour ? `${banquetInHour}:${banquetFormattedMin} ${banquetInPeriod}` : '';

        // Get previous banquet employees to check if we need to clear any
        const previousBanquetEmployees = shiftData[selectedDate]?.banquetEmployees || [];
        const previousExtraNames = (shiftData[selectedDate]?.extraBussers || []).map(e => e.name);

        // Supervisors who worked = the admin checkboxes. In-time and out-time are
        // both self-entered by the supervisor; banquet no longer affects supervisors.

        const newData = {
          ...shiftData,
          [selectedDate]: {
            totalTips: parseFloat(totalTips) || 0,
            endTime: fullEndTime,
            bussers10Count: parseInt(bussers10Count) || 0,
            bussers12Count: parseInt(bussers12Count) || 0,
            hasBanquet: hasBanquet,
            banquetEmployees: hasBanquet ? banquetEmployees : [],
            banquetInTime: hasBanquet ? fullBanquetInTime : '',
            // Paid separately by the manager — never used in any tip calculation
            banquetAmount: hasBanquet ? (parseFloat(banquetAmount) || 0) : 0,
            supervisorsWorked: supervisorsWorked,
            extraBussers: extraBussers,
            // Rebuilt from the form like every other field, so it must be included
            // here or re-saving a night would wipe its performers.
            performers: performers,
          }
        };
        setShiftData(newData);
        saveDataPartial('shiftData', { [selectedDate]: newData[selectedDate] });

        // Handle employee data updates
        let newEmployeeData = { ...employeeData };

        // Clear banquet data for employees who are no longer banquet workers
        // (either banquet was turned off, or they were removed from the list)
        const employeesToClear = previousBanquetEmployees.filter(empName =>
          !hasBanquet || !banquetEmployees.includes(empName)
        );

        employeesToClear.forEach(empName => {
          if (newEmployeeData[empName]?.[selectedDate]?.isBanquetWorker) {
            // Remove banquet-related data for this employee on this date
            const empDateData = { ...newEmployeeData[empName][selectedDate] };
            delete empDateData.startTimeOverride;
            delete empDateData.showStartOverride;
            delete empDateData.startTimeOverride_timestamp;
            delete empDateData.isBanquetWorker;

            // If no other data remains, remove the date entry entirely
            const hasOtherData = empDateData.startTime || empDateData.endTimeOverride;
            if (!hasOtherData) {
              delete empDateData.savedAt;
            }

            newEmployeeData = {
              ...newEmployeeData,
              [empName]: {
                ...newEmployeeData[empName],
                [selectedDate]: Object.keys(empDateData).length > 0 ? empDateData : undefined
              }
            };

            // Clean up undefined entries
            if (!newEmployeeData[empName][selectedDate]) {
              const empData = { ...newEmployeeData[empName] };
              delete empData[selectedDate];
              newEmployeeData[empName] = empData;
            }
          }
        });

        // Auto-populate banquet workers' employee data
        const hasBanquetChanges = (hasBanquet && banquetEmployees.length > 0 && fullBanquetInTime) || employeesToClear.length > 0;

        if (hasBanquet && banquetEmployees.length > 0 && fullBanquetInTime) {
          banquetEmployees.forEach(empName => {
            newEmployeeData = {
              ...newEmployeeData,
              [empName]: {
                ...(newEmployeeData[empName] || {}),
                [selectedDate]: {
                  ...(newEmployeeData[empName]?.[selectedDate] || {}),
                  startTimeOverride: fullBanquetInTime,
                  showStartOverride: true,
                  startTimeOverride_timestamp: Date.now(),
                  isBanquetWorker: true,
                  savedAt: Date.now()
                }
              }
            };
          });
        }

        // Extra bussers — mirror into employeeData exactly like banquet does,
        // so the busser's own page shows the admin-entered in-time.
        const extraNamesNow = extraBussers.map(e => e.name);
        const extrasToClear = previousExtraNames.filter(n => !extraNamesNow.includes(n));

        extrasToClear.forEach(empName => {
          if (newEmployeeData[empName]?.[selectedDate]?.isExtraBusser) {
            const empDateData = { ...newEmployeeData[empName][selectedDate] };
            delete empDateData.startTimeOverride;
            delete empDateData.showStartOverride;
            delete empDateData.startTimeOverride_timestamp;
            delete empDateData.isExtraBusser;

            const hasOtherData = empDateData.startTime || empDateData.endTimeOverride;
            if (!hasOtherData) {
              delete empDateData.savedAt;
            }

            newEmployeeData = {
              ...newEmployeeData,
              [empName]: {
                ...newEmployeeData[empName],
                [selectedDate]: Object.keys(empDateData).length > 0 ? empDateData : undefined
              }
            };

            if (!newEmployeeData[empName][selectedDate]) {
              const empData = { ...newEmployeeData[empName] };
              delete empData[selectedDate];
              newEmployeeData[empName] = empData;
            }
          }
        });

        if (extraBussers.length > 0) {
          extraBussers.forEach(entry => {
            if (!entry || !entry.name || !entry.inTime) return;
            newEmployeeData = {
              ...newEmployeeData,
              [entry.name]: {
                ...(newEmployeeData[entry.name] || {}),
                [selectedDate]: {
                  ...(newEmployeeData[entry.name]?.[selectedDate] || {}),
                  startTimeOverride: entry.inTime,
                  showStartOverride: true,
                  startTimeOverride_timestamp: Date.now(),
                  isExtraBusser: true,
                  savedAt: Date.now()
                }
              }
            };
          });
        }

        const hasExtraChanges = extraBussers.length > 0 || extrasToClear.length > 0;

        // ONLY save employeeData if there were actual banquet/extras changes
        // This prevents overwriting employee data if admin just saves shift info
        if (hasBanquetChanges || hasExtraChanges) {
          setEmployeeData(newEmployeeData);
          saveData('employeeData', newEmployeeData);
        }

        setSaved(true);
        setShowSaveCheck(true);
        setTimeout(() => {
          setSaved(false);
          setShowSaveCheck(false);
        }, 3000);
      };

      const handleDeleteEntry = (date, e) => {
        e.stopPropagation();
        if (confirm(`Delete entry for ${formatDate(new Date(date + 'T12:00:00'), 'long')}?`)) {
          const newData = { ...shiftData };
          delete newData[date];
          setShiftData(newData);
          saveDataPartial('shiftData', { [date]: window.firestoreDeleteField() });
        }
      };

      const handleLoadEntry = (date) => {
        setSelectedDate(date);
        setCurrentPage('shift-data'); // Navigate to shift data page to show the shift data
      };

      // Check if employee already has custom end time
      const checkEmployeeCustomTime = (employeeName) => {
        const empData = employeeData[employeeName];
        if (!empData || !empData[selectedDate]) return false;

        const dayData = empData[selectedDate];
        // Check if they have an end time override
        return dayData.endTimeOverride && dayData.endTimeOverride.trim() !== '';
      };

      // Toggle the batch early-departure section
      const handleEarlyDepartureToggle = () => {
        setShowEarlyDeparture(!showEarlyDeparture);
        setBatchCutSelected([]);
        setEarlyEndHour('');
        setEarlyEndMin('00');
        setEarlyEndPeriod('AM');
      };

      const toggleBatchCutEmployee = (empName) => {
        setBatchCutSelected(prev =>
          prev.includes(empName) ? prev.filter(n => n !== empName) : [...prev, empName]
        );
      };

      // Save one cut time for every checked busser (cuts happen in waves —
      // different waves = run this twice, section stays open)
      const handleSaveBatchCuts = () => {
        if (batchCutSelected.length === 0 || !earlyEndHour) return;

        const formattedMin = earlyEndMin.toString().padStart(2, '0');
        const earlyTime = `${earlyEndHour}:${formattedMin} ${earlyEndPeriod}`;

        let newEmployeeData = { ...employeeData };
        batchCutSelected.forEach(empName => {
          newEmployeeData = {
            ...newEmployeeData,
            [empName]: {
              ...(newEmployeeData[empName] || {}),
              [selectedDate]: {
                ...(newEmployeeData[empName]?.[selectedDate] || {}),
                endTimeOverride: earlyTime,
                showEndOverride: true,
                endTimeOverride_timestamp: Date.now(),
                adminSetEarlyDeparture: true,
                savedAt: Date.now() // CRITICAL: savedAt so employee page shows this data
              }
            }
          };
        });

        setEmployeeData(newEmployeeData);
        saveData('employeeData', newEmployeeData);

        alert(`✓ Cut time ${earlyTime} saved for ${batchCutSelected.length} busser(s)`);
        setBatchCutSelected([]);
        setEarlyEndHour('');
        setEarlyEndMin('00');
        setEarlyEndPeriod('AM');
      };

      // Add / remove an extra busser (custom in-time) in the form
      const handleAddExtraBusser = () => {
        if (!extraName || !extraInHour) return;
        const formattedMin = extraInMin.toString().padStart(2, '0');
        const inTime = `${extraInHour}:${formattedMin} ${extraInPeriod}`;
        setExtraBussers([...extraBussers, { name: extraName, inTime }]);
        setExtraName('');
        setExtraInHour('');
        setExtraInMin('00');
        setExtraInPeriod('PM');
      };

      const handleRemoveExtraBusser = (empName) => {
        setExtraBussers(extraBussers.filter(e => e.name !== empName));
      };

      // Open edit early departure modal
      const handleOpenEditDeparture = (employeeName) => {
        const empData = employeeData[employeeName][selectedDate];
        const endTime = empData.endTimeOverride;

        // Parse the time
        const match = endTime.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (match) {
          setEditDepartureHour(match[1]);
          setEditDepartureMin(match[2]);
          setEditDeparturePeriod(match[3].toUpperCase());
        }

        setEditingEmployee(employeeName);
        setShowEditDepartureModal(true);
      };

      // Save edited early departure
      const handleSaveEditDeparture = () => {
        if (!editingEmployee || !editDepartureHour) return;

        const formattedMin = editDepartureMin.toString().padStart(2, '0');
        const newTime = `${editDepartureHour}:${formattedMin} ${editDeparturePeriod}`;

        const newEmployeeData = {
          ...employeeData,
          [editingEmployee]: {
            ...(employeeData[editingEmployee] || {}),
            [selectedDate]: {
              ...(employeeData[editingEmployee]?.[selectedDate] || {}),
              endTimeOverride: newTime,
              showEndOverride: true,
              endTimeOverride_timestamp: Date.now(),
              adminSetEarlyDeparture: true,
              savedAt: Date.now()
            }
          }
        };

        setEmployeeData(newEmployeeData);
        saveData('employeeData', newEmployeeData);

        alert(`✓ Updated: ${editingEmployee} now leaves at ${newTime}`);
        setShowEditDepartureModal(false);
      };

      // Delete early departure
      const handleDeleteDeparture = () => {
        if (!confirm(`Remove early departure for ${editingEmployee}?`)) return;

        const currentData = employeeData[editingEmployee]?.[selectedDate] || {};

        // Build new data with Firebase deleteField() to remove end time fields
        const newEntry = { ...currentData };
        delete newEntry.endTimeOverride;
        delete newEntry.showEndOverride;
        delete newEntry.endTimeOverride_timestamp;
        delete newEntry.adminSetEarlyDeparture;

        // If there's no other data (no start time), remove the entry completely
        const hasOtherData = newEntry.startTime || newEntry.startTimeOverride;

        if (!hasOtherData) {
          // Remove entire entry for this date
          const newUserData = { ...employeeData[editingEmployee] };
          delete newUserData[selectedDate];

          const newEmployeeData = {
            ...employeeData,
            [editingEmployee]: newUserData
          };

          setEmployeeData(newEmployeeData);
          saveData('employeeData', newEmployeeData);
        } else {
          // Keep the entry but remove end time fields using deleteField
          const firebaseEntry = {
            ...newEntry,
            endTimeOverride: window.firestoreDeleteField(),
            showEndOverride: window.firestoreDeleteField(),
            endTimeOverride_timestamp: window.firestoreDeleteField(),
            adminSetEarlyDeparture: window.firestoreDeleteField()
          };

          const firebaseUserData = {
            ...employeeData[editingEmployee],
            [selectedDate]: firebaseEntry
          };

          const firebaseEmployeeData = {
            ...employeeData,
            [editingEmployee]: firebaseUserData
          };

          // Update local state with clean data
          const cleanEmployeeData = {
            ...employeeData,
            [editingEmployee]: {
              ...employeeData[editingEmployee],
              [selectedDate]: newEntry
            }
          };

          setEmployeeData(cleanEmployeeData);
          saveData('employeeData', firebaseEmployeeData);
        }

        alert(`✓ Early departure removed for ${editingEmployee}`);
        setShowEditDepartureModal(false);
      };

      // Handle adding new employee
      const handleAddEmployee = async () => {
        if (!newEmployeeName.trim() || !newEmployeeId.trim()) {
          alert('Please enter both employee name and ID');
          return;
        }

        const name = newEmployeeName.trim();
        const id = newEmployeeId.trim();

        // PERMANENT-SAFE WRITE: an atomic Firestore transaction reads the CURRENT
        // server list and applies only this one add. It never uses cached data, and
        // if the server can't be reached it throws and aborts — so a bad connection
        // can never overwrite the real roster with a stale copy (that was the bug
        // that kept dropping people). Concurrent edits are retried automatically.
        const docRef = window.firestoreDoc(window.firebaseDb, 'appData', 'rosterV2');
        try {
          const result = await window.firestoreRunTransaction(window.firebaseDb, async (tx) => {
            const snap = await tx.get(docRef);
            const current = (snap.exists() && Array.isArray(snap.data().value)) ? snap.data().value : [];
            if (current.some(emp => emp.id === id)) {
              return { status: 'exists' };
            }
            const updated = [...current, { name, id }].sort((a, b) => a.name.localeCompare(b.name));
            tx.set(docRef, { value: updated }, { merge: true });
            return { status: 'added', updated };
          });

          if (result.status === 'exists') {
            alert('Employee ID already exists');
            return;
          }
          // Reflect the server-confirmed list locally
          setEmployeeList(result.updated);
          setNewEmployeeName('');
          setNewEmployeeId('');
          alert(`✓ Added employee: ${name}`);
        } catch (err) {
          console.error('Add employee failed:', err);
          alert('Could not reach the server. Nothing was changed — check your connection and try again.');
        }
      };

      // Handle removing employee
      const handleRemoveEmployee = async (employeeToRemove) => {
        if (!confirm(`Remove ${employeeToRemove.name} from the employee list?`)) {
          return;
        }

        // Same atomic, server-authoritative write as add: reads the current server
        // list inside a transaction and removes only this one person. Aborts on a
        // failed connection instead of writing a stale roster.
        const docRef = window.firestoreDoc(window.firebaseDb, 'appData', 'rosterV2');
        try {
          const result = await window.firestoreRunTransaction(window.firebaseDb, async (tx) => {
            const snap = await tx.get(docRef);
            const current = (snap.exists() && Array.isArray(snap.data().value)) ? snap.data().value : [];
            const updated = current.filter(emp => emp.id !== employeeToRemove.id);
            tx.set(docRef, { value: updated }, { merge: true });
            return { updated };
          });
          setEmployeeList(result.updated);
        } catch (err) {
          console.error('Remove employee failed:', err);
          alert('Could not reach the server. Nothing was changed — check your connection and try again.');
        }
      };

      // Calculate preview
      const preview = (() => {
        const formattedMin = endTimeMin.toString().padStart(2, '0');
        const fullEndTime = endTimeHour ? `${endTimeHour}:${formattedMin} ${endTimePeriod}` : '';
        if (!totalTips || !fullEndTime) return null;

        const banquetFormattedMin = banquetInMin.toString().padStart(2, '0');
        const fullBanquetInTime = banquetInHour ? `${banquetInHour}:${banquetFormattedMin} ${banquetInPeriod}` : '';

        // Build the shift exactly as it would be saved, run it through the real pool math
        const tempShift = {
          totalTips: parseFloat(totalTips) || 0,
          endTime: fullEndTime,
          bussers10Count: parseInt(bussers10Count) || 0,
          bussers12Count: parseInt(bussers12Count) || 0,
          hasBanquet: hasBanquet,
          banquetEmployees: hasBanquet ? banquetEmployees : [],
          banquetInTime: hasBanquet ? fullBanquetInTime : '',
          extraBussers: extraBussers
        };
        const pool = computeShiftPool(tempShift, employeeData, selectedDate);
        if (!pool) return null;

        return {
          totalHours: pool.totalStaffHours,
          tipPool: pool.tipPool,
          perHour: pool.perHour,
          supervisorRate: pool.perHour * SUPERVISOR_MULTIPLIER
        };
      })();

      // Render the Banquet page
      const renderBanquetPage = () => (
        <div style={styles.content}>
          <div style={styles.card}>
            <h2 style={styles.cardTitle}>Banquet</h2>

            <div style={styles.inputGroup}>
              <label style={styles.label}>Date</label>
              <input
                type="date"
                value={selectedDate}
                onChange={(e) => setSelectedDate(e.target.value)}
                style={styles.input}
              />
              <p style={{...styles.hint, marginTop: '6px'}}>
                Same night as the Shift tab. Banquet money is separate from tips and is never part of any calculation.
              </p>
            </div>

          <div style={{marginBottom: '16px'}}>
            <label style={{...styles.label, display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer'}}>
              <span>Was there a banquet?</span>
              <button
                type="button"
                onClick={() => {
                  setHasBanquet(!hasBanquet);
                  if (hasBanquet) {
                    setBanquetEmployees([]);
                    setBanquetAmount('');
                    setBanquetInHour('');
                    setBanquetInMin('00');
                    setBanquetInPeriod('PM');
                  }
                }}
                style={{
                  padding: '8px 16px',
                  borderRadius: '8px',
                  border: 'none',
                  background: hasBanquet ? '#22c55e' : 'rgba(255,255,255,0.1)',
                  color: hasBanquet ? '#fff' : '#888899',
                  fontWeight: '600',
                  cursor: 'pointer',
                  transition: 'all 0.2s'
                }}
              >
                {hasBanquet ? 'Yes' : 'No'}
              </button>
            </label>
          </div>

          {hasBanquet && (
            <div style={{background: 'rgba(34, 197, 94, 0.1)', padding: '16px', borderRadius: '12px', border: '1px solid rgba(34, 197, 94, 0.3)'}}>
              <div style={styles.inputGroup}>
                <label style={styles.label}>Banquet Tip-Out ($ per worker)</label>
                <input
                  type="number"
                  value={banquetAmount}
                  onChange={(e) => setBanquetAmount(e.target.value)}
                  style={{...styles.input, width: '100%'}}
                  placeholder="0.00"
                  min="0"
                  step="0.01"
                />
                <p style={{...styles.hint, marginTop: '6px'}}>
                  Separate money from the manager. Not used in any tip math.
                </p>
              </div>

              <div style={styles.inputGroup}>
                <label style={styles.label}>Banquet IN Time (same for all)</label>
                <div style={styles.timeInputGroup}>
                  <input
                    type="number"
                    value={banquetInHour}
                    onChange={(e) => {
                      const val = e.target.value;
                      if (val === '') {
                        setBanquetInHour('');
                      } else {
                        const num = parseInt(val);
                        if (num >= 1 && num <= 12) {
                          setBanquetInHour(val);
                        }
                      }
                    }}
                    style={{...styles.input, flex: 1, textAlign: 'center'}}
                    placeholder="Hr"
                    min="1"
                    max="12"
                  />
                  <span style={{color: '#888899', fontSize: '24px', alignSelf: 'center'}}>:</span>
                  <input
                    type="number"
                    value={banquetInMin}
                    onChange={(e) => {
                      const val = e.target.value;

    // Admin Login Modal
