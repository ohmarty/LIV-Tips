    // Employee Dashboard Component
    function EmployeeDashboard({ user, shiftData, employeeData, setEmployeeData, onLogout, dataReady }) {
      const today = new Date();
      const [periodOffset, setPeriodOffset] = useState(0);
      const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;
      
      // Calculate pay period with offset
      const getOffsetPayPeriod = (offset) => {
        const baseDate = new Date(today);
        baseDate.setDate(baseDate.getDate() + (offset * PAY_PERIOD_DAYS));
        return getPayPeriod(baseDate);
      };
      
      const { startDate, endDate } = getOffsetPayPeriod(periodOffset);
      const dates = getDatesInPeriod(startDate, endDate);
      const isCurrentPeriod = periodOffset === 0;
      
      // Use employeeData directly instead of local state
      const localData = employeeData[user.username] || {};

      const [tab, setTab] = useState('tips'); // 'tips' | 'performers'

      // Add Shift Modal state
      const [showAddShiftModal, setShowAddShiftModal] = useState(false);
      const [modalDate, setModalDate] = useState(null);
      const [modalStartTime, setModalStartTime] = useState('');

      // Manual save function - only called when user clicks SAVE in modal
      const saveShiftData = (date, shiftInfo) => {
        // SAFEGUARD: Check if data is actually ready in React state
        // This prevents overwriting other users' data if React state hasn't updated yet
        if (!dataReady) {
          alert('Please wait for data to load before saving.');
          return;
        }

        const key = dateKey(date);
        const currentUserData = employeeData[user.username] || {};
        const timestamp = Date.now();

        // Build clean entry for React state — spread the existing entry first so
        // admin-owned fields (endTimeOverride etc.) survive locally as well
        const cleanEntry = {
          ...(currentUserData[key] || {}),
          savedAt: timestamp,
          ...shiftInfo
        };

        // OWNERSHIP RULE: bussers only ever WRITE their start selection.
        // They never delete anything — end times (cuts) belong to admin, and the
        // old deleteField() calls here were silently erasing admin-set cut times
        // whenever a busser re-saved their shift.
        const firebaseEntry = {
          savedAt: timestamp,
          ...shiftInfo
        };

        // Update React state with clean data
        const newUserData = {
          ...currentUserData,
          [key]: cleanEntry
        };
        const newEmployeeData = { ...employeeData, [user.username]: newUserData };

        // Save to Firebase with deleteField markers
        const firebaseUserData = {
          ...currentUserData,
          [key]: firebaseEntry
        };
        const firebaseEmployeeData = { ...employeeData, [user.username]: firebaseUserData };

        logger.log('info', `💾 Saving shift data for ${user.username} on ${key}`, shiftInfo);
        logger.log('info', `📥 Clean data for React state:`, cleanEntry);
        logger.log('info', `📥 Data with deleteField markers for Firebase:`, firebaseEntry);

        setEmployeeData(newEmployeeData);
        saveDataPartial('employeeData', { [user.username]: { [key]: firebaseEntry } });
      };

      // Convert "3:00 AM" to "03:00" (24-hour format for input type="time")
      const convertTo24Hour = (timeStr) => {
        if (!timeStr) return '';
        const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!match) return '';

        let hours = parseInt(match[1]);
        const minutes = match[2];
        const period = match[3].toUpperCase();

        if (period === 'AM' && hours === 12) hours = 0;
        if (period === 'PM' && hours !== 12) hours += 12;

        return `${String(hours).padStart(2, '0')}:${minutes}`;
      };

      // Convert "03:00" to "3:00 AM" (12-hour format for storage)
      const convertToAMPM = (time24) => {
        if (!time24) return '';
        const [hours24, minutes] = time24.split(':');
        let hours = parseInt(hours24);
        const period = hours >= 12 ? 'PM' : 'AM';

        if (hours === 0) hours = 12;
        else if (hours > 12) hours -= 12;

        return `${hours}:${minutes} ${period}`;
      };

      // Validate time format (e.g., "3:00 AM", "10:30 PM")
      const validateTimeInput = (value) => {
        if (!value || value.trim() === '') return true; // Allow empty

        // Match format like "3:00 AM" or "10:30 PM"
        const timeRegex = /^(1[0-2]|[1-9]):([0-5][0-9])\s*(AM|PM)$/i;
        return timeRegex.test(value.trim());
      };

      // Open Add Shift Modal
      const openAddShiftModal = (date) => {
        const key = dateKey(date);
        const existingData = localData[key] || {};
        const shift = shiftData[key];

        // Days where admin set the time (banquet or extra-busser) are read-only for the busser
        const isExtraDay = !!(shift && (shift.extraBussers || []).some(e => e.name === user.username));
        if (isExtraDay || existingData.isBanquetWorker) {
          alert('Your time for this shift was set by admin.');
          return;
        }

        setModalDate(date);
        setModalStartTime(existingData.startTime || '');
        setShowAddShiftModal(true);
      };

      // Save shift from modal
      const handleSaveShift = () => {
        if (!modalDate) return;

        const key = dateKey(modalDate);
        const existingData = localData[key] || {};

        // Start FRESH - don't carry over old time fields
        const shiftInfo = {};
        const timestamp = Date.now();

        logger.log('info', '🔵 SAVE BUTTON CLICKED', { modalStartTime, existingData });

        // Bussers only pick 10 PM or 12 AM. Everything else (banquet in-times,
        // extra in-times, cut times) is entered by admin.
        if (modalStartTime) {
          logger.log('success', '✅ Using preset start time', { time: modalStartTime });
          shiftInfo.startTime = modalStartTime;
          shiftInfo.startTime_timestamp = timestamp;
        } else {
          logger.log('error', '❌ No start time selected');
          alert('Please select a start time');
          return;
        }

        logger.log('info', '📦 Final shiftInfo to save (will replace all old time fields)', shiftInfo);
        saveShiftData(modalDate, shiftInfo);
        setShowAddShiftModal(false);

        // Brief confirmation
        const toast = document.createElement('div');
        toast.textContent = '✓ Saved';
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;z-index:9999;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      };

      // Clear/reset employee's shift data for a date
      const handleClearShift = () => {
        if (!dataReady) {
          alert('Please wait for data to load.');
          return;
        }
        if (!confirm('Clear your start time for this date?')) return;

        const key = dateKey(modalDate);
        const existingEntry = (employeeData[user.username] || {})[key] || {};

        // OWNERSHIP RULE: busser clear removes only busser-owned start fields.
        // Admin-owned data (cut times, banquet flags) must survive.
        const hasAdminData = existingEntry.endTimeOverride || existingEntry.isBanquetWorker || existingEntry.isExtraBusser;

        let newUserData;
        let firebaseUserData;

        if (hasAdminData) {
          // Keep the entry, strip only the start selection
          const strippedClean = { ...existingEntry };
          delete strippedClean.startTime;
          delete strippedClean.startTime_timestamp;

          newUserData = { ...(employeeData[user.username] || {}), [key]: strippedClean };
          firebaseUserData = {
            ...(employeeData[user.username] || {}),
            [key]: {
              ...strippedClean,
              startTime: window.firestoreDeleteField(),
              startTime_timestamp: window.firestoreDeleteField()
            }
          };
        } else {
          // Nothing admin-owned here — remove the whole entry
          newUserData = { ...(employeeData[user.username] || {}) };
          delete newUserData[key];
          firebaseUserData = {
            ...(employeeData[user.username] || {}),
            [key]: window.firestoreDeleteField()
          };
        }

        setEmployeeData({ ...employeeData, [user.username]: newUserData });
        saveDataPartial('employeeData', { [user.username]: { [key]: window.firestoreDeleteField() } });

        setShowAddShiftModal(false);
        alert('✓ Start time cleared');
      };

      const updateDayData = (date, field, value) => {
        const key = dateKey(date);
        setLocalData(prev => {
          const newDayData = { ...prev[key] };

          // If value is empty string or just whitespace, delete the field instead of setting it
          if (!value || (typeof value === 'string' && value.trim() === '')) {
            delete newDayData[field];
            // Also delete the timestamp for this field
            delete newDayData[field + '_timestamp'];
          } else {
            // Trim time override values to ensure clean data
            if ((field === 'startTimeOverride' || field === 'endTimeOverride') && typeof value === 'string') {
              newDayData[field] = value.trim();
            } else {
              newDayData[field] = value;
            }
            // Add timestamp for this field change
            newDayData[field + '_timestamp'] = Date.now();
          }

          return {
            ...prev,
            [key]: newDayData
          };
        });
      };

      // Calculate tip for a day
      const calculateDayTip = (date) => {
        const key = dateKey(date);
        const shift = shiftData[key];
        const rawDayData = localData[key];

        // ONLY use data with savedAt timestamp (ignore old data)
        const dayData = rawDayData?.savedAt ? rawDayData : null;

        if (!shift || !shift.totalTips || !shift.endTime) return null;

        // ---- MY START ----
        // Priority: admin-entered extra in-time > banquet in-time > my 10/12 pick > legacy override
        const extraEntry = (shift.extraBussers || []).find(e => e && e.name === user.username);

        let startTime = null;
        if (extraEntry && extraEntry.inTime) {
          startTime = extraEntry.inTime;
        } else if (dayData && dayData.isBanquetWorker && dayData.startTimeOverride) {
          startTime = dayData.startTimeOverride;
        } else if (dayData) {
          const hasOverride = dayData.startTimeOverride && dayData.startTimeOverride.trim() !== '';
          const hasDropdown = dayData.startTime;
          if (hasOverride && hasDropdown) {
            // LEGACY: old self-set custom starts — most recent wins
            const overrideTime = dayData.startTimeOverride_timestamp || 0;
            const dropdownTime = dayData.startTime_timestamp || 0;
            if (overrideTime > dropdownTime) startTime = dayData.startTimeOverride;
            else if (dayData.startTime === '10') startTime = '10:00 PM';
            else if (dayData.startTime === '12') startTime = '12:00 AM';
          } else if (hasOverride) {
            startTime = dayData.startTimeOverride;
          } else if (hasDropdown) {
            if (dayData.startTime === '10') startTime = '10:00 PM';
            else if (dayData.startTime === '12') startTime = '12:00 AM';
          }
        }

        if (!startTime) return null;

        // ---- MY END ---- admin-set cut wins over shift close
        let endTime = shift.endTime;
        if (dayData && dayData.endTimeOverride && dayData.endTimeOverride.trim() !== '') {
          endTime = dayData.endTimeOverride;
        }

        // ---- POOL ---- single source of truth
        const pool = computeShiftPool(shift, employeeData, key);
        if (!pool) return null;

        const myHours = calculateHours(startTime, endTime);
        const myTip = pool.perHour * myHours;

        return { myTip, myHours, perHour: pool.perHour };
      };

      // Calculate totals
      const totals = dates.reduce((acc, date) => {
        const result = calculateDayTip(date);
        if (result) {
          acc.hours += result.myHours;
          acc.tips += result.myTip;
          acc.banquet += getBanquetAmount(shiftData[dateKey(date)], user.username);
        }
        return acc;
      }, { hours: 0, tips: 0, banquet: 0 });

      return (
        <div style={styles.container}>
          <header style={styles.header}>
            <div>
              <h1 style={styles.headerTitle}>LIV Tips</h1>
              <p style={styles.headerSubtitle}>Welcome, {user.username}</p>
            </div>
            <button onClick={onLogout} style={styles.logoutBtn}>Logout</button>
          </header>
          
          <div style={{...styles.content, ...(isMobile ? { padding: '16px 12px' } : {})}}>
            <DashboardTabs tab={tab} setTab={setTab} showCalendar sticky={tab === 'calendar'} />

            {tab === 'performers' ? (
              <PerformersView shiftData={shiftData} employeeData={employeeData} />
            ) : tab === 'calendar' ? (
              <CalendarView
                shiftData={shiftData}
                getDay={(date) => {
                  const key = dateKey(date);
                  const raw = localData[key] || {};
                  const dd = raw.savedAt ? raw : {};
                  const r = calculateDayTip(date);
                  return {
                    amount: r ? r.myTip : null,
                    banquet: getBanquetAmount(shiftData[key], user.username),
                    start: dd.startTimeOverride || (dd.startTime === '10' ? '10 PM' : dd.startTime === '12' ? '12 AM' : ''),
                    end: dd.endTimeOverride || shiftData[key]?.endTime || ''
                  };
                }}
              />
            ) : (<>
            <div style={styles.periodCard}>
              <div style={styles.periodNav}>
                <button 
                  onClick={() => setPeriodOffset(periodOffset - 1)}
                  style={styles.periodNavBtn}
                >
                  ← Prev
                </button>
                <div style={styles.periodInfo}>
                  <h2 style={styles.periodTitle}>
                    {isCurrentPeriod ? 'Current Pay Period' : 'Pay Period'}
                  </h2>
                  <p style={styles.periodDates}>
                    {formatDate(startDate, 'long')} — {formatDate(endDate, 'long')}
                  </p>
                </div>
                <button 
                  onClick={() => setPeriodOffset(periodOffset + 1)}
                  style={styles.periodNavBtn}
                >
                  Next →
                </button>
              </div>
              {!isCurrentPeriod && (
                <button 
                  onClick={() => setPeriodOffset(0)}
                  style={styles.goToCurrentBtn}
                >
                  Go to Current Period
                </button>
              )}
            </div>
            
            <div style={styles.tableContainer}>
              <div style={isMobile ? styles.tableHeaderMobile : styles.tableHeader}>
                <span>Date</span>
                <span>Start</span>
                <span>End</span>
                <span>Performer</span>
                <span style={{textAlign: 'right'}}>Tips</span>
              </div>
              
              {dates.map(date => {
                const key = dateKey(date);
                const shift = shiftData[key];
                const rawDayData = localData[key] || {};

                // ONLY use data that has savedAt timestamp (new system)
                // Ignore old data without savedAt
                const dayData = rawDayData.savedAt ? rawDayData : {};

                const result = calculateDayTip(date);
                const isToday = dateKey(date) === dateKey(today);

                const hasShiftData = dayData.startTime || dayData.startTimeOverride;
                const nightPerformers = getShiftPerformers(shift);
                const nightBanquet = getBanquetAmount(shift, user.username);

                return (
                  <div key={key} style={{...(isMobile ? styles.tableRowMobile : styles.tableRow), ...(isToday ? styles.tableRowToday : {})}}>
                    <span style={styles.colDate}>
                      <span style={styles.dateText}>{formatDate(date)}</span>
                      <span style={styles.dayText}>
                        {date.toLocaleDateString('en-US', { weekday: 'short' })}
                      </span>
                    </span>

                    {!hasShiftData ? (
                      <>
                        <div style={{gridColumn: '2 / 5', display: 'flex', justifyContent: 'center', minWidth: 0}}>
                          <button
                            onClick={() => openAddShiftModal(date)}
                            style={{...styles.addShiftBtn, ...(isMobile ? { padding: '8px 14px', fontSize: '12px', whiteSpace: 'nowrap' } : {})}}
                          >
                            Add Shift
                          </button>
                        </div>
                        <span style={styles.colTip}></span>
                      </>
                    ) : (
                      <>
                        <div style={styles.colTime}>
                          <span style={{fontSize: isMobile ? '11px' : '13px'}} onClick={() => openAddShiftModal(date)}>
                            {dayData.startTimeOverride || (dayData.startTime === '10' ? '10 PM' : dayData.startTime === '12' ? '12 AM' : '--')}
                          </span>
                        </div>

                        <div style={styles.colTime}>
                          <span style={{fontSize: isMobile ? '11px' : '13px', color: '#888899'}} onClick={() => openAddShiftModal(date)}>
                            {dayData.endTimeOverride || shift?.endTime || '--'}
                          </span>
                        </div>

                        <PerformerCell names={nightPerformers} />

                        <span style={styles.colTip}>
                          {result ? (
                            <>
                            <span style={{...styles.tipAmount, ...(isMobile ? { fontSize: '13px' } : {})}}>${result.myTip.toFixed(2)}</span>
                            {nightBanquet > 0 && (
                              <span style={{display: 'block', fontSize: '11px', fontWeight: 700, color: '#ffc857', whiteSpace: 'nowrap'}}>
                                B: ${Math.round(nightBanquet)}
                              </span>
                            )}
                            </>
                          ) : (
                            <span style={styles.tipEmpty}>--</span>
                          )}
                        </span>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
            
            <div style={styles.totalsCard}>
              <div style={styles.totalItem}>
                <span style={styles.totalLabel}>Total Hours</span>
                <span style={styles.totalValue}>{formatHours(totals.hours)}</span>
              </div>
              <div style={styles.totalDivider} />
              <div style={styles.totalItem}>
                <span style={styles.totalLabel}>Total Tips</span>
                <span style={styles.totalValueHighlight}>${totals.tips.toFixed(2)}</span>
              </div>
              {totals.banquet > 0 && (
                <>
                  <div style={styles.totalDivider} />
                  <div style={styles.totalItem}>
                    <span style={styles.totalLabel}>Banquet</span>
                    <span style={{...styles.totalValueHighlight, color: '#ffc857'}}>${totals.banquet.toFixed(2)}</span>
                  </div>
                </>
              )}
            </div>
            </>)}

            {/* Add Shift Modal */}
            {showAddShiftModal && (
              <div style={styles.modal}>
                <div style={styles.modalContent}>
                  <h2 style={styles.modalTitle}>Add Shift - {formatDate(modalDate)}</h2>

                  <div style={styles.modalSection}>
                    <label style={styles.modalLabel}>Start Shift Time</label>
                    <div style={styles.radioGroup}>
                      <label style={styles.radioLabel}>
                        <input
                          type="radio"
                          name="startTime"
                          value="10"
                          checked={modalStartTime === '10'}
                          onChange={() => setModalStartTime('10')}
                        />
                        <span style={{marginLeft: '8px'}}>10 PM</span>
                      </label>
                      <label style={styles.radioLabel}>
                        <input
                          type="radio"
                          name="startTime"
                          value="12"
                          checked={modalStartTime === '12'}
                          onChange={() => setModalStartTime('12')}
                        />
                        <span style={{marginLeft: '8px'}}>12 AM</span>
                      </label>
                    </div>
                    <p style={{...styles.hint, marginTop: '12px'}}>
                      Different in-time or got cut early? Admin enters those.
                    </p>
                  </div>

                  <div style={{display: 'flex', gap: '12px', marginTop: '24px'}}>
                    <button onClick={() => setShowAddShiftModal(false)} style={styles.secondaryBtn}>
                      Cancel
                    </button>
                    <button onClick={handleSaveShift} style={styles.primaryBtn}>
                      Save
                    </button>
                  </div>

                  {/* Clear/Reset button */}
                  {localData[dateKey(modalDate)]?.savedAt && (
                    <button
                      onClick={handleClearShift}
                      style={{
                        ...styles.secondaryBtn,
                        width: '100%',
                        marginTop: '12px',
                        background: 'rgba(239, 68, 68, 0.1)',
                        border: '1px solid rgba(239, 68, 68, 0.3)',
                        color: '#ef4444'
                      }}
                    >
                      Clear / Reset
                    </button>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
    // ============================================
    // SUPERVISOR DASHBOARD
    // Read-only: supervisors enter nothing. Admin controls who worked and cuts.
    // Pay = busser tips/hr × 1.20 × hours (9:30 PM or banquet-in → close or cut).
    // ============================================
    function SupervisorDashboard({ user, shiftData, employeeData, setEmployeeData, onLogout }) {
      const today = getBusinessDay();
      const [periodOffset, setPeriodOffset] = useState(0);
      const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;

      const [tab, setTab] = useState('tips'); // 'tips' | 'calendar' | 'performers'

      // Switching tabs starts at the top (the calendar scrolls itself to today)
      useEffect(() => {
        if (tab !== 'calendar') window.scrollTo(0, 0);
      }, [tab]);

      // Times entry modal state — supervisor enters BOTH their in and out
      const [clockDate, setClockDate] = useState(null);
      const [inHour, setInHour] = useState('');
      const [inMin, setInMin] = useState('00');
      const [inPeriod, setInPeriod] = useState('PM');
      const [outHour, setOutHour] = useState('');
      const [outMin, setOutMin] = useState('00');
      const [outPeriod, setOutPeriod] = useState('AM');

      const getOffsetPayPeriod = (offset) => {
        const baseDate = new Date(today);
        baseDate.setDate(baseDate.getDate() + (offset * PAY_PERIOD_DAYS));
        return getPayPeriod(baseDate);
      };

      const { startDate, endDate } = getOffsetPayPeriod(periodOffset);
      const dates = getDatesInPeriod(startDate, endDate);

      const dayResult = (date) => {
        const key = dateKey(date);
        return computeSupervisorShift(shiftData[key], employeeData, key, user.id, user.username);
      };

      const totals = dates.reduce((acc, date) => {
        const r = dayResult(date);
        if (r && !r.pending) {
          acc.hours += r.hours;
          acc.tips += r.amount;
        }
        return acc;
      }, { hours: 0, tips: 0 });

      const pendingCount = dates.reduce((n, date) => {
        const r = dayResult(date);
        return n + (r && r.pending ? 1 : 0);
      }, 0);

      // Open the times entry for a date, prefilling whatever is already set
      const openTimes = (date) => {
        const key = dateKey(date);
        const existing = (employeeData[user.username] || {})[key] || {};
        const mi = (existing.supervisorClockIn || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (mi) { setInHour(mi[1]); setInMin(mi[2]); setInPeriod(mi[3].toUpperCase()); }
        else { setInHour(''); setInMin('00'); setInPeriod('PM'); }
        const mo = (existing.supervisorClockOut || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (mo) { setOutHour(mo[1]); setOutMin(mo[2]); setOutPeriod(mo[3].toUpperCase()); }
        else { setOutHour(''); setOutMin('00'); setOutPeriod('AM'); }
        setClockDate(date);
      };

      // Supervisor writes ONLY their own in/out. Never deletes, never touches admin fields.
      const saveTimes = () => {
        if (!inHour || !outHour) return;
        const key = dateKey(clockDate);
        const inTime = `${inHour}:${inMin.toString().padStart(2, '0')} ${inPeriod}`;
        const outTime = `${outHour}:${outMin.toString().padStart(2, '0')} ${outPeriod}`;
        const existingEntry = (employeeData[user.username] || {})[key] || {};
        const merged = { ...existingEntry, supervisorClockIn: inTime, supervisorClockOut: outTime, savedAt: Date.now() };
        const newEmployeeData = {
          ...employeeData,
          [user.username]: { ...(employeeData[user.username] || {}), [key]: merged }
        };
        setEmployeeData(newEmployeeData);
        saveData('employeeData', newEmployeeData);
        setClockDate(null);
      };

      // Delete the supervisor's own times for this shift so they can start over.
      // Removes ONLY supervisorClockIn/supervisorClockOut. If nothing else is on the
      // entry, the whole date is removed. Uses deleteField() because saves merge.
      const deleteTimes = () => {
        const key = dateKey(clockDate);
        const existingEntry = (employeeData[user.username] || {})[key] || {};
        if (!confirm('Delete your times for this shift? You can re-enter them after.')) return;

        const otherKeys = Object.keys(existingEntry).filter(
          k => !['savedAt', 'supervisorClockIn', 'supervisorClockOut'].includes(k)
        );

        let reactUserData = { ...(employeeData[user.username] || {}) };
        let firebaseEntry;

        if (otherKeys.length > 0) {
          // Preserve other fields (e.g. legacy data); strip only our two times
          const stripped = { ...existingEntry };
          delete stripped.supervisorClockIn;
          delete stripped.supervisorClockOut;
          reactUserData[key] = stripped;
          firebaseEntry = {
            ...stripped,
            supervisorClockIn: window.firestoreDeleteField(),
            supervisorClockOut: window.firestoreDeleteField()
          };
        } else {
          // Nothing else here — remove the whole date entry
          delete reactUserData[key];
          firebaseEntry = window.firestoreDeleteField();
        }

        setEmployeeData({ ...employeeData, [user.username]: reactUserData });
        saveData('employeeData', {
          ...employeeData,
          [user.username]: { ...(employeeData[user.username] || {}), [key]: firebaseEntry }
        });
        setClockDate(null);
      };

      // Whether the currently-open shift already has saved times (gates Delete button)
      const modalExisting = clockDate ? ((employeeData[user.username] || {})[dateKey(clockDate)] || {}) : {};
      const hasSavedTimes = !!(modalExisting.supervisorClockIn || modalExisting.supervisorClockOut);

      return (
        <div style={styles.container}>
          <header style={styles.header}>
            <div>
              <h1 style={styles.headerTitle}>LIV Tips</h1>
              <p style={styles.headerSubtitle}>Welcome, {user.username} · Supervisor</p>
            </div>
            <button onClick={onLogout} style={styles.logoutBtn}>Logout</button>
          </header>

          <div style={{...styles.content, ...(isMobile ? { padding: '16px 12px' } : {})}}>
            <DashboardTabs tab={tab} setTab={setTab} />

            {tab === 'performers' ? (
              <PerformersView shiftData={shiftData} employeeData={employeeData} />
            ) : (<>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px'}}>
              <button onClick={() => setPeriodOffset(periodOffset - 1)} style={styles.secondaryBtn}>←</button>
              <span style={{fontSize: '14px', color: '#888899'}}>
                {formatDate(startDate)} – {formatDate(endDate)}{periodOffset === 0 ? ' (current)' : ''}
              </span>
              <button
                onClick={() => setPeriodOffset(periodOffset + 1)}
                style={{...styles.secondaryBtn, ...(periodOffset >= 0 ? { opacity: 0.4 } : {})}}
                disabled={periodOffset >= 0}
              >
                →
              </button>
            </div>

            {pendingCount > 0 && (
              <div style={{
                padding: '12px 16px', marginBottom: '16px', borderRadius: '10px',
                background: 'rgba(255, 200, 87, 0.1)', border: '1px solid rgba(255, 200, 87, 0.3)',
                color: '#ffc857', fontSize: '13px'
              }}>
                {pendingCount} shift{pendingCount > 1 ? 's need' : ' needs'} your in and out times before pay can be calculated. Tap a shift below to add them.
              </div>
            )}

            <div style={styles.tableContainer}>
              <div style={isMobile ? styles.tableHeaderMobile : styles.tableHeader}>
                <span>Date</span>
                <span>In</span>
                <span>Out</span>
                <span>Performer</span>
                <span style={{textAlign: 'right'}}>Tips</span>
              </div>
              {dates.map(date => {
                const r = dayResult(date);
                const isToday = dateKey(date) === dateKey(today);
                const nightPerformers = getShiftPerformers(shiftData[dateKey(date)]);
                if (!r) return (
                  <div key={dateKey(date)} style={{...(isMobile ? styles.tableRowMobile : styles.tableRow), ...(isToday ? styles.tableRowToday : {}), opacity: 0.45}}>
                    <span style={styles.colDate}>
                      <span style={styles.dateText}>{formatDate(date)}</span>
                      <span style={styles.dayText}>{date.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                    </span>
                    <div style={{gridColumn: '2 / 4', textAlign: 'center', fontSize: '12px', color: '#888899'}}>—</div>
                    <PerformerCell names={nightPerformers} />
                    <span style={styles.colTip}></span>
                  </div>
                );
                return (
                  <div key={dateKey(date)} style={{...(isMobile ? styles.tableRowMobile : styles.tableRow), ...(isToday ? styles.tableRowToday : {})}}>
                    <span style={styles.colDate}>
                      <span style={styles.dateText}>{formatDate(date)}</span>
                      <span style={styles.dayText}>{date.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                    </span>
                    {r.pending ? (
                      <div style={{gridColumn: '2 / 4', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                        <button onClick={() => openTimes(date)} style={{...styles.secondaryBtn, padding: '6px 8px', fontSize: '11px', whiteSpace: 'nowrap'}}>
                          + set in & out
                        </button>
                      </div>
                    ) : (
                      <>
                        <div style={styles.colTime}>
                          <span style={{fontSize: isMobile ? '11px' : '13px', cursor: 'pointer'}} onClick={() => openTimes(date)}>
                            {r.inTime}
                          </span>
                        </div>
                        <div style={styles.colTime}>
                          <span style={{fontSize: isMobile ? '11px' : '13px', color: '#888899', cursor: 'pointer'}} onClick={() => openTimes(date)}>
                            {r.outTime}
                          </span>
                        </div>
                      </>
                    )}
                    <PerformerCell names={nightPerformers} />
                    <span style={styles.colTip}>
                      {r.pending ? (
                        <span style={{fontSize: '12px', color: '#ffc857'}}>pending</span>
                      ) : (
                        <span style={{...styles.tipAmount, ...(isMobile ? { fontSize: '13px' } : {})}}>${r.amount.toFixed(2)}</span>
                      )}
                    </span>
                  </div>
                );
              })}
            </div>

            <div style={styles.totalsCard}>
              <div style={styles.totalItem}>
                <span style={styles.totalLabel}>Total Hours</span>
                <span style={styles.totalValue}>{formatHours(totals.hours)}</span>
              </div>
              <div style={styles.totalDivider} />
              <div style={styles.totalItem}>
                <span style={styles.totalLabel}>Total Tips</span>
                <span style={styles.totalValueHighlight}>${totals.tips.toFixed(2)}</span>
              </div>
            </div>

            <p style={{fontSize: '12px', color: '#888899', textAlign: 'center', marginTop: '16px'}}>
              Rate = busser tips/hr × 1.20 · You enter your own in and out times
            </p>
            </>)}
          </div>

          {clockDate && (
            <div style={styles.modal}>
              <div style={styles.modalContent}>
                <h2 style={styles.modalTitle}>Your Times</h2>
                <p style={{...styles.subTitle, marginBottom: '20px'}}>
                  {formatDate(clockDate, 'long')}
                </p>
                <div style={styles.inputGroup}>
                  <label style={styles.label}>What time did you clock in?</label>
                  <div style={styles.timeInputGroup}>
                    <input
                      type="number" placeholder="Hr" min="1" max="12"
                      value={inHour}
                      onChange={(e) => {
                        const val = e.target.value;
                        if (val === '' || (parseInt(val) >= 1 && parseInt(val) <= 12)) setInHour(val);
                      }}
                      style={{...styles.input, flex: 1, textAlign: 'center'}}
                    />
                    <span style={{color: '#888899', fontSize: '24px', alignSelf: 'center'}}>:</span>
                    <input
                      type="number" placeholder="Min" min="0" max="59"
                      value={inMin}
                      onChange={(e) => {
                        const val = e.target.value;
                        if (val === '' || (parseInt(val) >= 0 && parseInt(val) <= 59)) setInMin(val);
                      }}
                      style={{...styles.input, flex: 1, textAlign: 'center'}}
                    />
                    <select
                      value={inPeriod}
                      onChange={(e) => setInPeriod(e.target.value)}
                      style={{...styles.select, width: '80px'}}
                    >
                      <option value="PM">PM</option>
                      <option value="AM">AM</option>
                    </select>
                  </div>
                </div>
                <div style={styles.inputGroup}>
                  <label style={styles.label}>What time did you clock out?</label>
                  <div style={styles.timeInputGroup}>
                    <input
                      type="number" placeholder="Hr" min="1" max="12"
                      value={outHour}
                      onChange={(e) => {
                        const val = e.target.value;
                        if (val === '' || (parseInt(val) >= 1 && parseInt(val) <= 12)) setOutHour(val);
                      }}
                      style={{...styles.input, flex: 1, textAlign: 'center'}}
                    />
                    <span style={{color: '#888899', fontSize: '24px', alignSelf: 'center'}}>:</span>
                    <input
                      type="number" placeholder="Min" min="0" max="59"
                      value={outMin}
                      onChange={(e) => {
                        const val = e.target.value;
                        if (val === '' || (parseInt(val) >= 0 && parseInt(val) <= 59)) setOutMin(val);
                      }}
                      style={{...styles.input, flex: 1, textAlign: 'center'}}
                    />
                    <select
                      value={outPeriod}
                      onChange={(e) => setOutPeriod(e.target.value)}
                      style={{...styles.select, width: '80px'}}
                    >
                      <option value="AM">AM</option>
                      <option value="PM">PM</option>
                    </select>
                  </div>
                </div>
                <div style={{display: 'flex', gap: '12px', marginTop: '20px'}}>
                  <button onClick={() => setClockDate(null)} style={{...styles.secondaryBtn, flex: 1}}>Cancel</button>
                  <button
                    onClick={saveTimes}
                    disabled={!inHour || !outHour}
                    style={{...styles.primaryBtn, flex: 1, ...((!inHour || !outHour) && styles.primaryBtnDisabled)}}
                  >
                    Save
                  </button>
                </div>
                {hasSavedTimes && (
                  <button
                    onClick={deleteTimes}
                    style={{
                      width: '100%', marginTop: '12px', padding: '10px',
                      background: 'transparent', color: '#f87171',
                      border: '1px solid rgba(248, 113, 113, 0.4)', borderRadius: '10px',
                      fontSize: '13px', cursor: 'pointer'
                    }}
                  >
                    Delete these times
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Main App Component
    // Track if data has been loaded from Firebase (prevents saving empty data)
    window.dataLoaded = {
      shiftData: false,
      employeeData: false,
      employeeList: false
    };

    function LIVTipsApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [shiftData, setShiftData] = useState({});
      const [employeeData, setEmployeeData] = useState({});
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [dataReady, setDataReady] = useState(false); // Track when Firebase data is actually in React state
      const [isAdmin, setIsAdmin] = useState(false);
      const [loading, setLoading] = useState(true);
      const [employeeList, setEmployeeList] = useState([]);

      // Load data from Firebase on mount and listen for real-time updates
      useEffect(() => {
        const unsubscribers = [];

        // Version check — forces all open sessions to reload when a new version is deployed
        const metaRef = window.firestoreDoc(window.firebaseDb, 'appData', 'meta');
        const unsubMeta = window.firestoreOnSnapshot(metaRef, (doc) => {
          const fromCache = doc.metadata ? doc.metadata.fromCache : false;
          const firestoreVersion = doc.exists() ? (doc.data().appVersion || 0) : 0;
          console.log(`🔖 Version check — app: v${window.APP_VERSION}, firestore: v${firestoreVersion}, fromCache: ${fromCache}`);
          if (firestoreVersion > window.APP_VERSION) {
            // This session is outdated — force reload to get the new version
            console.warn(`🔄 New version detected (v${firestoreVersion} > v${window.APP_VERSION}) — reloading...`);
            window.location.reload();
          } else if (window.APP_VERSION > firestoreVersion) {
            // This session has the newest version — update Firestore so old sessions reload
            console.log(`📢 Publishing new version v${window.APP_VERSION} to Firestore (was v${firestoreVersion})`);
            window.firestoreSetDoc(metaRef, { appVersion: window.APP_VERSION }, { merge: true });
          }
        });
        unsubscribers.push(unsubMeta);

        // Foreground check — when the app is reopened from the background, ask the
        // server (not the cache) whether a newer version was deployed, and reload.
        const checkVersionNow = async () => {
          if (document.visibilityState !== 'visible') return;
          try {
            const snap = await window.firestoreGetDocFromServer(metaRef);
            const serverVersion = snap.exists() ? (snap.data().appVersion || 0) : 0;
            if (serverVersion > window.APP_VERSION) {
              console.warn(`🔄 Foreground check: v${serverVersion} > v${window.APP_VERSION} — reloading...`);
              window.location.reload();
            }
          } catch (err) {
            console.warn('Foreground version check failed (offline?)', err);
          }
        };
        document.addEventListener('visibilitychange', checkVersionNow);
        window.addEventListener('pageshow', checkVersionNow);
        unsubscribers.push(() => {
          document.removeEventListener('visibilitychange', checkVersionNow);
          window.removeEventListener('pageshow', checkVersionNow);
        });

        // Listen to shiftData changes
        const shiftDataRef = window.firestoreDoc(window.firebaseDb, 'appData', 'shiftData');
        const unsubShiftData = window.firestoreOnSnapshot(shiftDataRef, (doc) => {
          window.dataLoaded.shiftData = true; // Mark as loaded BEFORE setting state
          if (doc.exists()) {
            const data = doc.data().value || {};
            console.log('📥 Firebase shiftData loaded:', Object.keys(data).length, 'entries');
            setShiftData(data);
          } else {
            console.log('⚠️ No shiftData document exists in Firebase');
          }
        });
        unsubscribers.push(unsubShiftData);

        // Listen to employeeData changes
        const employeeDataRef = window.firestoreDoc(window.firebaseDb, 'appData', 'employeeData');
        const unsubEmployeeData = window.firestoreOnSnapshot(employeeDataRef, (doc) => {
          window.dataLoaded.employeeData = true; // Mark as loaded BEFORE setting state
          if (doc.exists()) {
            const data = doc.data().value || {};
            logger.log('info', '🔄 Firebase employeeData updated', data);
            setEmployeeData(data);
            // Mark data as ready after state is set (setTimeout ensures state update completes)
            setTimeout(() => setDataReady(true), 100);
          } else {
            logger.log('warning', '⚠️ No employeeData document in Firebase');
            setTimeout(() => setDataReady(true), 100);
          }
        });
        unsubscribers.push(unsubEmployeeData);

        // Listen to employeeList changes
        // ROSTER ISOLATION (permanent drift fix): the employee roster lives in
        // 'rosterV2', a document that OLD cached versions of this app do not know
        // about — they read/write the legacy 'employeeList' doc, which nothing here
        // reads anymore. That makes a stale device physically unable to overwrite the
        // live roster: its clobbering writes land on a dead document. Combined with
        // the server-authoritative add/remove transactions, no client (old or new)
        // can revert this list.
        const employeeListRef = window.firestoreDoc(window.firebaseDb, 'appData', 'rosterV2');
        const unsubEmployeeList = window.firestoreOnSnapshot(employeeListRef, (doc) => {
          const fromCache = doc.metadata ? doc.metadata.fromCache : true;
          if (doc.exists()) {
            const storedEmployees = doc.data().value;
            if (storedEmployees && Array.isArray(storedEmployees) && storedEmployees.length > 0) {
              // Valid data from Firestore — display it. This listener NEVER writes back;
              // the only writes to employeeList come from the add/remove transactions.
              // (The old code merged missing supervisors here and wrote on load, which
              // was an extra clobber path — supervisors now live permanently in the doc.)
              window.dataLoaded.employeeList = true;
              console.log(`✅ [employeeList] Loaded ${storedEmployees.length} employees (fromCache: ${fromCache})`);
              setEmployeeList(storedEmployees);
            } else {
              // Document exists but data is empty/invalid — glitch, keep current state, never overwrite
              console.warn(`⚠️ [employeeList] Document exists but data is empty/invalid (fromCache: ${fromCache}) — ignoring, not overwriting Firestore`);
            }
          } else if (fromCache) {
            // THE OLD BUG LIVED HERE: an offline/local-cache snapshot says the doc is "missing",
            // the app seeded the hardcoded list, and when signal returned that write overwrote
            // the real list (removing added employees, restoring removed ones).
            // A cache miss is NOT proof the document doesn't exist on the server. Do nothing;
            // Firestore will fire this listener again with the server answer.
            console.warn(`⚠️ [employeeList] Doc missing in LOCAL CACHE only — waiting for server, NOT seeding`);
          } else {
            // Server itself confirms the document has never been created — true first-time setup
            window.dataLoaded.employeeList = true;
            console.warn(`⚠️ [employeeList] Server confirms document does not exist — seeding default list`);
            setEmployeeList(EMPLOYEES);
            saveData('rosterV2', EMPLOYEES);
          }
          setLoading(false);
        }, (error) => {
          console.error('🚫 [employeeList] Firestore snapshot error:', error.code, error.message);
          setLoading(false);
        });
        unsubscribers.push(unsubEmployeeList);

        // Cleanup listeners on unmount
        return () => {
          unsubscribers.forEach(unsub => unsub());
        };
      }, []);

      const handleLogin = (username, employeeId, role) => {
        if (username === '__ADMIN__') {
          setShowAdminLogin(true);
          return;
        }

        setCurrentUser({ username, id: employeeId, role });
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsAdmin(false);
      };

      if (loading) {
        return (
          <div style={{...styles.loginContainer, background: styles.container.background}}>
            <div style={{textAlign: 'center', color: '#888899'}}>
              <div style={{fontSize: '48px', marginBottom: '16px'}}>💰</div>
              <p>Loading LIV Tips...</p>
            </div>
          </div>
        );
      }

      if (showAdminLogin) {
        return (
          <AdminLogin
            onSuccess={() => { setShowAdminLogin(false); setIsAdmin(true); }}
            onCancel={() => setShowAdminLogin(false)}
          />
        );
      }

      if (isAdmin) {
        return (
          <AdminPanel
            shiftData={shiftData}
            setShiftData={setShiftData}
            employeeData={employeeData}
            setEmployeeData={setEmployeeData}
            employeeList={employeeList}
            setEmployeeList={setEmployeeList}
            onLogout={handleLogout}
          />
        );
      }

      if (!currentUser) {
        return <Login onLogin={handleLogin} employeeList={employeeList} />;
      }

      if (currentUser.role === 'supervisor') {
        return (
          <SupervisorDashboard
            user={currentUser}
            shiftData={shiftData}
            employeeData={employeeData}
            setEmployeeData={setEmployeeData}
            onLogout={handleLogout}
          />
        );
      }

      return (
        <EmployeeDashboard
          user={currentUser}
          shiftData={shiftData}
          employeeData={employeeData}
          setEmployeeData={setEmployeeData}
          onLogout={handleLogout}
          dataReady={dataReady}
        />
      );
    }

    // Render the app
    ReactDOM.createRoot(document.getElementById('root')).render(<LIVTipsApp />);
  </script>
</body>
</html>
